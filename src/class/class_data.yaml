# Course assignments
assignments:
  - name: "Assignment 0: Introduction to Programming and Python"
    due: "2026/04/01"
    points: 5
    materials:
      github: "https://classroom.github.com/a/uYEGH1wE"

  - name: "Assignment 1: Convolution, Interpolation, and Resizing"
    due: "2026/04/01"
    points: 10
    details: "Implement 2D convolution, separable convolution, and interpolation methods (nearest neighbor, bilinear, bicubic) from scratch. Compare your implementations with library functions for correctness and performance."

  - name: "Assignment 2: Streamlit/HuggingFace Demo & Peer Review"
    due: "2026/05/20"
    points: 10
    details: "Create an interactive educational demo explaining an image processing pipeline. Deploy it as a web application. During Part 1 (20 May), groups give a brief overview of their demo to the class. During Part 2 (27 May), each student individually presents their application for 5 minutes. Participate in peer review."

  - name: "Assignment 3: Deep Learning vs. Classical Methods"
    due: "2026/05/20"
    points: 15
    details: "Compare deep learning and classical methods for image classification. Implement both approaches, train models, evaluate performance, and analyze tradeoffs in interpretability and computational requirements."
